version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utamed-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utamed}
      POSTGRES_USER: ${POSTGRES_USER:-utamed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utamed_dev_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - utamed-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-utamed} -d ${POSTGRES_DB:-utamed}']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  utamed-network:
    driver: bridge
